<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Libro de Contaminación Ambiental con RA</title>

  <link rel="stylesheet" href="css/estilos.css">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <script src="js/orbita.js"></script>
  <script src="js/sistema.js"></script>
  <script src="js/libro.js" defer></script>
</head>

<body>
  <section id="panel" aria-label="Controles del libro">
    <header>
        <small>AULA ABIERTA · CIENCIA Y PLANETA</small>
        <h1>Contaminación Ambiental</h1>
        <p>Explorando nuestro entorno con Realidad Aumentada</p>
    </header>

    <label for="pagina">Explora una escena</label>

    <select id="pagina">
      <option value="1">01 · ¿Qué es la contaminación?</option>
      <option value="2">02 · Fuentes y causas principales</option>
      <option value="3">03 · Consecuencias en el ecosistema</option>
      <option value="4">04 · Prevención y mitigación</option>
      <option value="5">05 · Desarrollo sostenible</option>
    </select>

    <p id="contenido"></p>

    <div class="parapensar" style="background: rgba(193, 74, 54, 0.08); border-left: 3px solid #c14a36; padding: 8px 10px; margin: 10px 0; border-radius: 4px;">
        <span class="etiqueta-pensar" style="font-size: 11px; font-weight: bold; color: #c14a36; display: block; margin-bottom: 3px;">PARA PENSAR</span>
        <p id="pregunta-pensar" style="margin: 0; font-size: 13px;"></p>
    </div>

    <button id="pausa" type="button">Pausar animación</button>

    <p id="estado" role="status">
      Permite la cámara y enfoca Hiro.
    </p>

    <small>Modelos didácticos esquemáticos; no representan mediciones científicas.</small>
  </section>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      id="marcador"
      preset="hiro"
      emitevents="true">

      <a-entity
        id="sistema"
        sistema-solar
        position="0 0.15 0"
        scale="0.22 0.22 0.22">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
